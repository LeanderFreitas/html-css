<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexible box</title>
    <style>
        div.conteiner{
            background-color: black;
            display: flex;

        }
        div.item{
            background-color: blueviolet;
            border: 1px solid white;
            text-align: center;
        }
        div#cxA{
            /* 
             flex-shrink: 0;
             flex-grow: 1;   
             flex-basis: auto;
            */
             
             flex: 1 0 auto;
        }
        div#cxB{
            /* 
            flex-shrink: 1;
            flex-grow: 1;
            flex-basis: auto;
            */

            flex: 1 1 auto;
        }
        div#cxC{
            /*
            flex-shrink: 8;
            flex-grow: 1;
            flex-basis: auto;
            */
            flex: 1 8 auto ;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item"  id="cxA">A</div>
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>
    </div>
</body>
</html>
