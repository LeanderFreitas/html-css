<!DOCTYPE html>
<html lang="pr-br">
<head>

    <title>uso de tabelas grandes</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 500px;
        }
        td{
            border: solid 1px black;
        }
    </style>
</head>
<body>

                    </tr>
            </tbody>
            <tfoot>

            </tfoot>
    </table>

</html>
