<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabela</title>
    <style>
          body{
            font-family: Arial, Helvetica, sans-serif;
        }
        thead{
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
        table{
            border-collapse: collapse;
            width: 300px;
        }
        td{
            border: 1px solid black;
            padding: 10px;
            text-align: right;
        }
         td.conteudo{
            text-align: center;
        }
        td{
            text-align: left;
        }
    </style>
</head>
<body>
    <table>
        <thead>
          <tr>
                <td class="conteudo">Grupo</td>
                <td class="conteudo">Nomes</td>
                <td colspan="7" class="conteudo">Filmes</td>
          </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="3">Mulheres</td>
                <td colspan="5">Ana Maria Santos</td>
                <td colspan="1">Alien</td>
                <td colspan="1">Rambo</td>
                <td colspan="1">Vingadores</td>
                <tr>
                    <td colspan="5">Beatriz Souza</td>
                    <td colspan="1">Hulk</td>
                    <td colspan="1">Inception</td>
                    <td colspan="1">Batman</td>
                </tr>
                <tr>
                    <td colspan="5">Claudia Melo</td>
                    <td colspan="1">Obivion</td>
                    <td colspan="1">Matrix</td>
                    <td colspan="1">Big Hero</td>
                </tr>
            </tr>
            <tr>
                <td rowspan="3">Homens</td>
                <td colspan="5">Bruno Mendonça</td>
                <td>Intocáveis</td>
                <td>Amnésia</td>
                <td>Gladiador</td>
            </tr>
            <tr>
                <td colspan="5">Daniel Lourenço</td>
                <td >Wall-E</td>
                <td>Oldboy</td>
                <td>Dangal</td>
            </tr>
            <tr>
                <td colspan="5">Fabiano Mota</td>
                <td colspan="1">Star Wars </td>
                <td colspan="1">Taxi Driver</td>
                <td colspan="1">Toy Story</td>
            </tr>
            </tr>
        </tbody>
    </table>
</body>
</html>
